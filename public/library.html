<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2374A63F'/%3E%3Crect x='10' y='15' width='12' height='34' rx='3' fill='%23fff'/%3E%3Crect x='26' y='19' width='12' height='26' rx='3' fill='%23fff' opacity='.7'/%3E%3Crect x='42' y='24' width='12' height='16' rx='3' fill='%23fff' opacity='.4'/%3E%3C/svg%3E">
<title>版式库 · 版式画廊</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS — injected by server from tokens.json
   ═══════════════════════════════════════════════════════════════ */
<!-- ROOT_INJECT -->

/* ═══════════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body {
  overflow-x: clip;
  background: var(--color-surface);
  color: var(--color-on-surface);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }

/* ═══════════════════════════════════════════════════════════════
   GREEN HEADER — 与设计指南同款顶部
   ═══════════════════════════════════════════════════════════════ */
.learn-header{text-align:center;padding:clamp(40px,6vw,72px) clamp(20px,4vw,48px) var(--space-32);border-bottom:var(--hairline) solid var(--color-outline)}
.learn-header h1{font-family:var(--font-display);font-size:clamp(40px,7vw,64px);font-weight:700;letter-spacing:-0.03em;line-height:1.1;color:var(--heading);margin-bottom:var(--space-16)}
.learn-header .lead{font-size:var(--typescale-body-large);color:var(--color-on-surface-variant);max-width:560px;margin:0 auto;line-height:1.65}

/* ═══════════════════════════════════════════════════════════════
   FILTER BAR — sticky, hide on scroll, show on stop
   ═══════════════════════════════════════════════════════════════ */
.toolbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(249,251,249,0.9);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: var(--hairline) solid var(--color-outline-variant);
  padding: var(--space-12) clamp(20px, 4vw, 48px);
}

.toolbar-inner {
  max-width: var(--space-page-wmax); margin: 0 auto;
  display: flex; flex-direction: column; gap: var(--space-12);
}

.filter-row {
  display: flex; align-items: center; gap: var(--space-12); flex-wrap: wrap;
}

.filter-label {
  font-size: var(--typescale-label-medium); font-weight: 600; color: var(--color-on-surface-variant);
  white-space: nowrap; min-width: 36px; flex-shrink: 0;
  letter-spacing: 0.04em;
}

.filter-chips {
  display: flex; gap: var(--space-4); flex-wrap: wrap; align-items: center;
}

.filter-chip {
  padding: 6px var(--space-16);
  min-width: 88px; text-align: center;
  border-radius: var(--radius-xs);
  border: var(--hairline) solid var(--color-outline);
  background: transparent;
  font-size: var(--typescale-label-large); cursor: pointer; white-space: nowrap;
  transition: all var(--duration-fast); font-family: var(--font-body);
  color: var(--color-on-surface-variant); user-select: none; line-height: 1.4;
}
.filter-chip:hover { border-color: var(--color-primary); color: var(--color-primary); }
.filter-chip.active {
  background: var(--color-primary); color: #fff; border-color: var(--color-primary);
  font-weight: 600;
}

.filter-chip svg { display: inline-block; vertical-align: -2px; margin-right: 2px; }

/* ═══════════════════════════════════════════════════════════════
   CARD GRID
   ═══════════════════════════════════════════════════════════════ */
.content {
  padding: var(--space-32) clamp(20px, 4vw, 48px) var(--space-64);
  max-width: var(--space-page-wmax);
  margin: 0 auto;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-gutter);
}

.card {
  background: var(--color-surface-container-low);
  border: var(--hairline) solid var(--color-outline);
  border-radius: var(--radius-xs);
  cursor: pointer;
  transition: box-shadow var(--duration-slow), transform var(--duration-slow);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.card:hover {
  box-shadow: var(--elevation-md);
  transform: translateY(-2px);
}

.card-preview {
  aspect-ratio: 16/10; overflow: hidden; flex-shrink: 0;
  position: relative;
  background: var(--color-surface-container-low);
  border-bottom: var(--hairline) solid var(--color-outline);
}

.card-preview iframe {
  position: absolute; top: 0; left: 0; border: none;
  pointer-events: none; user-select: none; transform-origin: top left;
}

.card-preview-overlay {
  position: absolute; inset: 0; z-index: 2;
  background: rgba(0,0,0,0.08);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity var(--duration-slow); pointer-events: none;
}
.card-preview:hover .card-preview-overlay { opacity: 1; pointer-events: auto; }

.card-preview-open {
  padding: 8px var(--space-24);
  border-radius: var(--radius-xs);
  background: var(--color-primary);
  border: none;
  font-size: var(--typescale-label-large); font-weight: 600; cursor: pointer;
  color: #fff; font-family: var(--font-body); white-space: nowrap;
  transition: all 160ms;
}
.card-preview-open:hover {
  background: var(--color-primary); box-shadow: var(--elevation-md); transform: scale(1.04);
}

.card-body {
  padding: var(--space-16) var(--space-24); flex: 1;
  display: flex; flex-direction: column; gap: var(--space-8);
}

.card-name {
  font-family: var(--font-display);
  font-size: var(--typescale-title-medium); font-weight: 700;
  color: var(--heading); line-height: 1.25;
  transition: color var(--duration-base);
}
.card:hover .card-name { color: var(--color-primary); }

.card-tagline {
  font-size: var(--typescale-label-large); color: var(--color-on-surface-variant); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.card-tags { display: flex; flex-wrap: wrap; gap: var(--space-4); margin-top: auto; }

.tag {
  padding: 3px 10px; border-radius: var(--radius-xs);
  font-size: var(--typescale-label-medium); font-weight: 600;
  background: var(--color-surface); color: var(--color-on-surface-variant); white-space: nowrap;
}
.tag.mood { background: var(--color-primary-container); color: var(--color-primary); }

.card-palette { display: flex; flex-wrap: wrap; gap: 6px; padding-top: var(--space-8); }
.palette-dot { width: 14px; height: 14px; border-radius: 2px; border: 1.5px solid rgba(0,0,0,0.15); flex-shrink: 0; }

.card-detail-hint {
  font-size: var(--typescale-label-large); color: var(--color-on-surface-variant);
  padding-top: var(--space-12); cursor: pointer;
  font-family: var(--font-body);
}
.card:hover .card-detail-hint { color: var(--color-primary); text-decoration: underline; text-underline-offset: 3px; }

.card-footer {
  display: flex; align-items: center; justify-content: center;
  border-top: var(--hairline) solid var(--color-outline);
  background: var(--color-surface-container-low);
  transition: background var(--duration-fast);
}
.card-footer:hover { background: var(--color-primary); }

.card-brand-link {
  font-size: var(--typescale-label-large); font-weight: 600;
  color: var(--color-primary); padding: 10px 0; cursor: pointer;
  font-family: var(--font-body);
  transition: color var(--duration-fast);
  display: block; width: 100%; text-align: center;
}
.card-footer:hover .card-brand-link { color: #fff; }

/* ═══════════════════════════════════════════════════════════════
   BACK TO TOP
   ═══════════════════════════════════════════════════════════════ */
.back-to-top {
  position: fixed; bottom: 32px; right: 32px; z-index: 150;
  width: 44px; height: 44px;
  border-radius: 999px;
  border: none;
  background: var(--color-primary);
  color: #fff;
  box-shadow: var(--elevation-md);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity var(--duration-base), transform var(--duration-base);
  transform: translateY(8px);
}
.back-to-top.visible {
  opacity: 1; pointer-events: auto;
  transform: translateY(0);
}
.back-to-top:hover { background: var(--color-primary); transform: translateY(-2px); }

/* ═══════════════════════════════════════════════════════════════
   EMPTY STATE
   ═══════════════════════════════════════════════════════════════ */
.empty {
  text-align: center; padding: clamp(48px, 8vw, 80px) var(--space-24);
  color: var(--color-on-surface-variant);
}
.empty h3 {
  font-family: var(--font-display); font-size: var(--typescale-title-medium);
  margin-bottom: var(--space-8); color: var(--color-on-surface-variant);
}
.empty p { font-size: var(--typescale-label-large); }

/* ═══════════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════════ */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 200;
  justify-content: center; align-items: flex-start;
  padding: 60px 20px 40px; overflow-y: auto;
}
.modal-overlay.open { display: flex; }

.modal-box {
  background: var(--color-surface);
  border-radius: var(--radius-xs);
  max-width: 560px; width: 100%;
  box-shadow: var(--elevation-md);
  border: var(--hairline) solid var(--color-outline);
  position: relative;
}

.modal-header {
  padding: var(--space-24) var(--space-24) 0;
  display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-16);
}
.modal-header h2 {
  font-family: var(--font-display);
  font-size: var(--typescale-headline-large); font-weight: 700; line-height: 1.2;
  color: var(--heading);
}
.modal-close {
  background: none; border: none; font-size: var(--typescale-title-medium); cursor: pointer;
  color: var(--color-on-surface-variant); padding: 4px 8px; line-height: 1; flex-shrink: 0;
}
.modal-close:hover { color: var(--color-on-surface); }

.modal-body {
  padding: var(--space-16) var(--space-24) var(--space-24);
  display: flex; flex-direction: column; gap: var(--space-16);
}
.modal-tagline {
  font-size: var(--typescale-body-medium); color: var(--color-on-surface-variant); line-height: 1.6;
}
.modal-section h4 {
  font-size: var(--typescale-label-medium); font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--color-on-surface-variant); margin-bottom: var(--space-8);
}
.modal-section p { font-size: var(--typescale-label-large); line-height: 1.6; }
.modal-philosophy { font-style: italic; color: var(--color-on-surface-variant); }
.modal-list { list-style: disc; padding-left: 1.25em; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.modal-list li { font-size: var(--typescale-label-large); color: var(--color-on-surface-variant); line-height: 1.6; }
.modal-color-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.mc-chip { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 16px; border-radius: 8px; font-size: var(--typescale-label-large); font-weight: 600; min-width: 80px; }
.mc-chip small { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; font-weight: 400; }
.modal-scale-rows { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.ms-row { font-size: var(--typescale-label-large); color: var(--color-on-surface-variant); }
.ms-row b { color: var(--color-on-surface); font-family: var(--font-mono); font-size: var(--typescale-label-medium); font-weight: 600; margin-right: 4px; }

.modal-actions { display: flex; gap: var(--space-12); margin-top: var(--space-8); }

.modal-link {
  display: inline-flex; align-items: center; gap: var(--space-8);
  padding: var(--space-12) var(--space-24);
  background: var(--color-surface); color: var(--color-primary);
  border: var(--hairline) solid var(--color-primary);
  border-radius: var(--radius-xs);
  text-decoration: none; font-weight: 600;
  font-size: var(--typescale-label-large); font-family: var(--font-body);
  transition: all var(--duration-fast);
}
.modal-link:hover {
  background: var(--color-primary); color: #fff;
  transform: translateY(-1px); box-shadow: var(--elevation-sm);
}

.modal-dark { background: #1a1a1a; }
.modal-dark .modal-header h2 { color: #fff; }
.modal-dark .modal-tagline { color: rgba(255,255,255,0.85); }
.modal-dark .modal-section h4 { color: rgba(255,255,255,0.55); }
.modal-dark .modal-section p { color: rgba(255,255,255,0.8); }
.modal-dark .modal-close { color: rgba(255,255,255,0.55); }
.modal-dark .modal-close:hover { color: #fff; }
.modal-dark .modal-list li { color: rgba(255,255,255,0.7); }
.modal-dark .ms-row { color: rgba(255,255,255,0.7); }
.modal-dark .ms-row b { color: rgba(255,255,255,0.9); }
.modal-dark .modal-link { background: rgba(255,255,255,0.12); color: #fff; border-color: rgba(255,255,255,0.3); }
.modal-dark .modal-link:hover { background: rgba(255,255,255,0.22); color: #fff; }

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE
   ═══════════════════════════════════════════════════════════════ */
@media (max-width: 1100px) {
  .grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 680px) {
  .grid { grid-template-columns: 1fr; }
  .toolbar { padding: var(--space-12) var(--space-16); }
  .toolbar-inner { gap: var(--space-8); }
  .content { padding: var(--space-24) var(--space-16) var(--space-48); }
}
</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════
   TAXONOMY — labels loaded from /api/taxonomy
   ═══════════════════════════════════════════════════════════════ */
var taxonomy = null;

/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
var templates = [];
var F = { vf: 'all', scheme: 'all' };

var FILTER_DIMS = [
  { key: 'vf', field: 'visual_family', container: 'vfChips' },
  { key: 'scheme', field: 'scheme', container: 'schemeChips' }
];

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
async function init() {
  try {
    var res = await fetch('/api/registry');
    var data = await res.json();
    templates = data.items.filter(function(t) { return t.status !== 'placeholder'; });
  } catch(e) {
    document.getElementById('layoutGrid').innerHTML = '<div class="empty"><h3>未找到模板数据</h3><p>请确认服务已启动</p></div>';
    return;
  }

  try {
    var txRes = await fetch('/api/taxonomy');
    taxonomy = await txRes.json();
  } catch(e) {
    taxonomy = null;
  }

  FILTER_DIMS.forEach(renderChips);
  renderGrid(applyFilters());
  bindEvents();
}

init();

/* ═══════════════════════════════════════════════════════════════
   FILTERS
   ═══════════════════════════════════════════════════════════════ */
function applyFilters() {
  return templates.filter(function(t) {
    if (F.vf !== 'all' && t.visual_family !== F.vf) return false;
    if (F.scheme !== 'all' && t.scheme !== F.scheme) return false;
    return true;
  });
}

function renderChips(dim) {
  var el = document.getElementById(dim.container);
  if (!el) return;
  var values = taxonomy && taxonomy[dim.field] ? taxonomy[dim.field].values : {};
  var keys = Object.keys(values);
  if (!keys.length) return;

  var html = '<button class="filter-chip active" data-dim="' + dim.key + '" data-val="all" onclick="selectDim(\'' + dim.key + '\',\'all\')">全部</button>';
  keys.forEach(function(k) {
    var label = values[k] && values[k].label ? values[k].label : k;
    html += '<button class="filter-chip" data-dim="' + dim.key + '" data-val="' + k + '" onclick="selectDim(\'' + dim.key + '\',\'' + k + '\')">' + label + '</button>';
  });
  el.innerHTML = html;
}

function selectDim(dimKey, val) {
  F[dimKey] = val;
  document.querySelectorAll('[data-dim="' + dimKey + '"]').forEach(function(el) {
    el.classList.toggle('active', el.dataset.val === val);
  });
  renderGrid(applyFilters());
}

/* ═══════════════════════════════════════════════════════════════
   RENDER GRID
   ═══════════════════════════════════════════════════════════════ */
function renderGrid(items) {
  var grid = document.getElementById('layoutGrid');
  var empty = document.getElementById('emptyState');

  if (items.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  var vfKV = taxonomy && taxonomy.visual_family ? taxonomy.visual_family.values : {};
  var schemeKV = taxonomy && taxonomy.scheme ? taxonomy.scheme.values : {};

  grid.innerHTML = items.map(function(t) {
    var previewPath = toRootPath(t.template_path);
    var tags = [];
    if (t.visual_family && vfKV[t.visual_family]) {
      tags.push('<span class="tag mood">' + vfKV[t.visual_family].label + '</span>');
    }
    if (t.scheme && schemeKV[t.scheme]) {
      tags.push('<span class="tag">' + schemeKV[t.scheme].label + '</span>');
    }

    return '<div class="card">' +
      '<div class="card-preview" onclick="event.stopPropagation();window.open(\'' + previewPath + '\',\'_blank\')" style="cursor:pointer">' +
        '<iframe data-src="' + previewPath + '" width="960" height="600" sandbox="allow-scripts"></iframe>' +
        '<div class="card-preview-overlay" onclick="event.stopPropagation()">' +
          '<button class="card-preview-open" onclick="event.stopPropagation();window.open(\'' + previewPath + '\',\'_blank\')">打开预览 ↗</button>' +
        '</div>' +
      '</div>' +
      '<div class="card-body" onclick="event.stopPropagation();openModal(\'' + t.slug + '\')" style="cursor:pointer">' +
        '<div class="card-name">' + t.name + '</div>' +
        (t.tagline ? '<div class="card-tagline">' + t.tagline + '</div>' : '') +
        '<div class="card-tags">' + tags.join('') + '</div>' +
        (t.palette && t.palette.length ? '<div class="card-palette">' + t.palette.map(function(p) { return '<span class="palette-dot" style="background:' + p.color + '" title="' + p.name + '"></span>'; }).join('') + '</div>' : '') +
        '<div class="card-detail-hint">查看详情 →</div>' +
      '</div>' +
      '<div class="card-footer">' +
        '<a class="card-brand-link" href="/brand/' + t.slug + '/" target="_blank" onclick="event.stopPropagation()">品牌套件</a>' +
      '</div>' +
    '</div>';
  }).join('');
  loadAllIframes();
}

function toRootPath(path) {
  var value = String(path || '');
  return value.charAt(0) === '/' ? value : '/' + value;
}

function scaleIframe(iframe) {
  var container = iframe.parentElement;
  if (!container) return;
  var w = container.offsetWidth;
  if (!w) return;
  iframe.style.transform = 'scale(' + (w / 960) + ')';
}

function loadAllIframes() {
  document.querySelectorAll('iframe[data-src]').forEach(function(iframe) {
    if (!iframe.dataset.src) return;
    iframe.onload = function() {
      scaleIframe(iframe);
    };
    // Establish the 960x600 viewport and load handler before navigation. This
    // keeps responsive template scripts from booting against the 300x150
    // default iframe viewport and avoids missing a fast load event.
    scaleIframe(iframe);
    iframe.src = iframe.dataset.src;
  });
}

function scaleIframes() {
  document.querySelectorAll('.card-preview iframe').forEach(function(iframe) {
    scaleIframe(iframe);
  });
}

/* ═══════════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════════ */
function renderPrinciples(text) {
  var lines = text.split('\n').filter(function(l) { return l.trim(); });
  if (lines.length === 0) return '<p>' + text + '</p>';
  return '<ul class="modal-list">' + lines.map(function(l) {
    return '<li>' + l.trim() + '</li>';
  }).join('') + '</ul>';
}

function renderColorSystem(text) {
  var parts = text.split(';').filter(function(p) { return p.trim(); });
  if (parts.length === 0) return '<p>' + text + '</p>';
  return '<div class="modal-color-chips">' + parts.map(function(p) {
    var kv = p.split(':');
    var name = kv[0] ? kv[0].trim() : '';
    var val = kv[1] ? kv[1].trim() : '';
    var isDark = val.startsWith('#') && (function(h) {
      var r = parseInt(h.substring(1,3),16);
      var g = parseInt(h.substring(3,5),16);
      var b = parseInt(h.substring(5,7),16);
      return (r+g+b)/3 < 128;
    })(val);
    return '<span class="mc-chip" style="background:' + val + ';color:' + (isDark ? '#fff' : '#111') + '">' + name + '<small>' + val + '</small></span>';
  }).join('') + '</div>';
}

function renderTypeScale(text) {
  var parts = text.split(';').filter(function(p) { return p.trim(); });
  if (parts.length === 0) return '<p>' + text + '</p>';
  return '<div class="modal-scale-rows">' + parts.map(function(p) {
    var kv = p.split(':');
    var name = kv[0] ? kv[0].trim() : '';
    var val = kv[1] ? kv[1].trim() : '';
    return '<span class="ms-row"><b>' + name + '</b> ' + val + '</span>';
  }).join('') + '</div>';
}

function openModal(slug) {
  var t = templates.find(function(x) { return x.slug === slug; });
  if (!t) return;

  var vfKV = taxonomy && taxonomy.visual_family ? taxonomy.visual_family.values : {};
  var schemeKV = taxonomy && taxonomy.scheme ? taxonomy.scheme.values : {};

  var vfLabel = t.visual_family && vfKV[t.visual_family] ? vfKV[t.visual_family].label : null;
  var schemeLabel = t.scheme && schemeKV[t.scheme] ? schemeKV[t.scheme].label : (t.scheme || '—');
  var isDark = t.scheme === 'dark';

  var tagLine = [vfLabel, schemeLabel].filter(Boolean).join(' · ');

  document.getElementById('modalBox').className = 'modal-box' + (isDark ? ' modal-dark' : '');
  document.getElementById('modalBox').removeAttribute('style');
  document.getElementById('modalBox').innerHTML =
    '<div class="modal-header">' +
      '<h2>' + t.name + '</h2>' +
      '<button class="modal-close" onclick="closeModal()">✕</button>' +
    '</div>' +
    '<div class="modal-body">' +
      (t.tagline ? '<div class="modal-tagline">' + t.tagline + '</div>' : '') +
      (t.design_philosophy ? '<div class="modal-section"><h4>设计理念</h4><p class="modal-philosophy">' + t.design_philosophy + '</p></div>' : '') +
      (t.design_principles ? '<div class="modal-section"><h4>设计原则</h4><div class="modal-principles">' + renderPrinciples(t.design_principles) + '</div></div>' : '') +
      (t.color_system ? '<div class="modal-section"><h4>六色系统</h4><div class="modal-colors">' + renderColorSystem(t.color_system) + '</div></div>' : '') +
      (t.typography_scale ? '<div class="modal-section"><h4>排版尺度</h4><div class="modal-type-scale">' + renderTypeScale(t.typography_scale) + '</div></div>' : '') +
      '<div class="modal-section"><h4>分类</h4><p>' + tagLine + '</p></div>' +
      (t.best_for ? '<div class="modal-section"><h4>适用场景</h4><p>' + t.best_for + '</p></div>' : '') +
      (t.avoid_for ? '<div class="modal-section"><h4>不适用</h4><p>' + t.avoid_for + '</p></div>' : '') +
      '<div class="modal-actions">' +
        '<a href="' + t.template_path + '" target="_blank" class="modal-link">预览模板</a>' +
        '<a href="/brand/' + t.slug + '/" target="_blank" class="modal-link">品牌套件</a>' +
      '</div>' +
    '</div>';
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ═══════════════════════════════════════════════════════════════
   EVENTS
   ═══════════════════════════════════════════════════════════════ */
function bindEvents() {
  // Keyboard
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  // Sync toolbar top with nav height
  var toolbar = document.getElementById('filters');
  var nav = document.querySelector('.site-nav');
  function syncTop() {
    if (nav && toolbar) toolbar.style.top = nav.offsetHeight + 'px';
  }
  syncTop();
  window.addEventListener('resize', function() {
    syncTop();
    scaleIframes();
  });

  // Scroll: hide while scrolling, show after stop
  var ticking = false;
  window.addEventListener('scroll', function() {
    if (!ticking) {
      requestAnimationFrame(function() {
        var btt = document.getElementById('backToTop');
        if (btt) {
          btt.classList.toggle('visible', window.scrollY > 400);
        }
        ticking = false;
      });
      ticking = true;
    }
  }, { passive: true });
}
</script>
