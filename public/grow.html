<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2374A63F'/%3E%3Crect x='10' y='15' width='12' height='34' rx='3' fill='%23fff'/%3E%3Crect x='26' y='19' width='12' height='26' rx='3' fill='%23fff' opacity='.7'/%3E%3Crect x='42' y='24' width='12' height='16' rx='3' fill='%23fff' opacity='.4'/%3E%3C/svg%3E">
<title>AI 萃取 · 版式画廊</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS — injected by server from tokens.json
   ═══════════════════════════════════════════════════════════════ */
<!-- ROOT_INJECT -->

/* ═══════════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body {
  overflow-x: clip;
  background: var(--color-surface);
  color: var(--color-on-surface);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }

/* ═══════════════════════════════════════════════════════════════
   PAGE HEADER
   ═══════════════════════════════════════════════════════════════ */
.learn-header{background:var(--color-primary);text-align:center;padding:clamp(48px,6vw,72px) clamp(20px,4vw,48px) var(--space-48);border-bottom:none}
.learn-header h1{font-family:var(--font-display);font-size:clamp(40px,7vw,64px);font-weight:700;letter-spacing:-0.03em;line-height:1.1;color:#fff;margin-bottom:var(--space-16)}
.learn-header .lead{font-size:var(--typescale-body-large);color:rgba(255,255,255,0.85);max-width:560px;margin:0 auto;line-height:1.65}

/* ═══════════════════════════════════════════════════════════════
   COMING SOON（白底，独立于绿色英雄区）
   ═══════════════════════════════════════════════════════════════ */
.grow-coming {
  text-align: center;
  padding: 32px var(--space-24) var(--space-48);
}
/* 徽章与绿色英雄区间距收紧到 32px（覆盖 nav.html 的 hero padding-bottom） */
body.grow.green .learn-header { padding-bottom: 32px; }
.coming-soon {
  display: inline-flex;
  align-items: center;
  gap: .8rem;
  font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2rem);
  font-weight: 700;
  letter-spacing: .1em;
  color: #262B27;
  background: #D9E26B;
  padding: .9rem 1.5rem;
  border-radius: 14px;
}
.coming-soon::before { content: ""; width: .9rem; height: .9rem; background: #262B27; border-radius: 50%; }
</style>
</head>
<body class="green grow">
<!-- NAV_INJECT -->

<header class="learn-header">
  <h1>AI 萃取</h1>
  <p class="lead">输入网站 URL，自动提取设计 token，生成品牌套件。</p>
</header>

<section class="grow-coming">
  <p class="coming-soon">即将开放</p>
</section>

<!-- FOOTER_INJECT -->
</body>
</html>
