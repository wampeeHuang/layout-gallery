<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470">
<defs>
  <marker id="arrow-pass" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#3D6B4A"/>
  </marker>
  <marker id="arrow-fail" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#b9670b"/>
  </marker>
  <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 Z" fill="#7b97aa"/>
  </marker>
</defs>

<rect width="100%" height="100%" fill="#f5f8f4"/>

<text x="520" y="38" text-anchor="middle" style="font-family:'JetBrains Mono','Cascadia Code','Consolas','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:17px;fill:#102638;font-weight:600">四门串行判定：全过才能交付</text>
<text x="520" y="62" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:12px;fill:#587287">四个门依次过；任何一个门不过，回去修，修完从第一门重新过</text>

<!-- ===== 主流程 ===== -->

<!-- 网页 -->
<g transform="translate(78,170)">
  <rect x="-58" y="-34" width="116" height="68" rx="10" style="fill:#ffffff;stroke:#7b97aa;stroke-width:1.8"/>
  <text y="-6" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:14px;fill:#102638;font-weight:600">待交付网页</text>
  <text y="16" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:10.5px;fill:#587287">做完 ≠ 能上线</text>
</g>

<!-- 四个门（菱形） -->
<g transform="translate(262,170)">
  <path d="M -72 0 L 0 -52 L 72 0 L 0 52 Z" style="fill:rgba(61,107,74,0.08);stroke:#3D6B4A;stroke-width:1.8"/>
  <text y="-8" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:14px;fill:#102638;font-weight:600">能访问？</text>
  <text y="14" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:10px;fill:#587287">打得开 · 加载快</text>
</g>

<g transform="translate(448,170)">
  <path d="M -72 0 L 0 -52 L 72 0 L 0 52 Z" style="fill:rgba(61,107,74,0.08);stroke:#3D6B4A;stroke-width:1.8"/>
  <text y="-8" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:14px;fill:#102638;font-weight:600">能理解？</text>
  <text y="14" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:10px;fill:#587287">看得懂 · 有层次</text>
</g>

<g transform="translate(634,170)">
  <path d="M -72 0 L 0 -52 L 72 0 L 0 52 Z" style="fill:rgba(61,107,74,0.08);stroke:#3D6B4A;stroke-width:1.8"/>
  <text y="-8" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:14px;fill:#102638;font-weight:600">能行动？</text>
  <text y="14" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:10px;fill:#587287">找得到 · 走得通</text>
</g>

<g transform="translate(820,170)">
  <path d="M -72 0 L 0 -52 L 72 0 L 0 52 Z" style="fill:rgba(61,107,74,0.08);stroke:#3D6B4A;stroke-width:1.8"/>
  <text y="-8" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:14px;fill:#102638;font-weight:600">能相信？</text>
  <text y="14" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:10px;fill:#587287">信得过 · 记得住</text>
</g>

<!-- 可以交付 -->
<g transform="translate(972,170)">
  <rect x="-56" y="-34" width="112" height="68" rx="10" style="fill:rgba(61,107,74,0.10);stroke:#3D6B4A;stroke-width:2"/>
  <text y="-6" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:14px;fill:#2c4f36;font-weight:600">可以交付</text>
  <text y="16" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:10.5px;fill:#587287">四门全过</text>
</g>

<!-- 过 箭头 -->
<path d="M 136 170 L 183 170" style="fill:none;stroke:#3D6B4A;stroke-width:1.8;stroke-linecap:round" marker-end="url(#arrow-pass)"/>
<text x="160" y="156" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:11px;fill:#3D6B4A;font-weight:600">过</text>

<path d="M 334 170 L 369 170" style="fill:none;stroke:#3D6B4A;stroke-width:1.8;stroke-linecap:round" marker-end="url(#arrow-pass)"/>
<text x="352" y="156" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:11px;fill:#3D6B4A;font-weight:600">过</text>

<path d="M 520 170 L 555 170" style="fill:none;stroke:#3D6B4A;stroke-width:1.8;stroke-linecap:round" marker-end="url(#arrow-pass)"/>
<text x="538" y="156" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:11px;fill:#3D6B4A;font-weight:600">过</text>

<path d="M 706 170 L 741 170" style="fill:none;stroke:#3D6B4A;stroke-width:1.8;stroke-linecap:round" marker-end="url(#arrow-pass)"/>
<text x="724" y="156" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:11px;fill:#3D6B4A;font-weight:600">过</text>

<path d="M 892 170 L 909 170" style="fill:none;stroke:#3D6B4A;stroke-width:1.8;stroke-linecap:round" marker-end="url(#arrow-pass)"/>
<text x="900" y="156" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:11px;fill:#3D6B4A;font-weight:600">过</text>

<!-- ===== 不过：回去修 ===== -->

<g transform="translate(541,330)">
  <rect x="-330" y="-28" width="660" height="56" rx="10" style="fill:rgba(217,119,6,0.08);stroke:#b9670b;stroke-width:1.8"/>
  <text y="-4" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:13px;fill:#102638;font-weight:600">回去修</text>
  <text y="16" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:10.5px;fill:#587287">修完从第一门重新过——后面的门不查前面门的问题</text>
</g>

<!-- 每个门 不过 向下 -->
<path d="M 262 222 L 262 296" style="fill:none;stroke:#b9670b;stroke-width:1.6;stroke-dasharray:6,4;stroke-linecap:round" marker-end="url(#arrow-fail)"/>
<text x="278" y="262" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:11px;fill:#b9670b">不过</text>

<path d="M 448 222 L 448 296" style="fill:none;stroke:#b9670b;stroke-width:1.6;stroke-dasharray:6,4;stroke-linecap:round" marker-end="url(#arrow-fail)"/>

<path d="M 634 222 L 634 296" style="fill:none;stroke:#b9670b;stroke-width:1.6;stroke-dasharray:6,4;stroke-linecap:round" marker-end="url(#arrow-fail)"/>

<path d="M 820 222 L 820 296" style="fill:none;stroke:#b9670b;stroke-width:1.6;stroke-dasharray:6,4;stroke-linecap:round" marker-end="url(#arrow-fail)"/>

<!-- 回到第一门 -->
<path d="M 211 330 L 78 330 L 78 212" style="fill:none;stroke:#7b97aa;stroke-width:1.6;stroke-linecap:round" marker-end="url(#arrow-gray)"/>
<text x="132" y="318" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:11px;fill:#587287">重过四门</text>

<text x="520" y="418" text-anchor="middle" style="font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;font-size:11px;fill:#587287">串行的意义：能访问不过，不用看理解；理解不过，不用看行动；行动不过，信任无从谈起。</text>

</svg>
