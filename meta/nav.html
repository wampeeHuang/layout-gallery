<script src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.12/dist/turbo.es2017-umd.js"></script>
<style>
@font-face{font-family:"Inter";src:local("Segoe UI"),local("Helvetica Neue"),local("Arial")}
@font-face{font-family:"Noto Sans SC";src:local("PingFang SC"),local("Microsoft YaHei"),local("Hiragino Sans GB"),sans-serif}
html{overflow-y:scroll}
/* Site nav — uses gallery tokens via var(), blocks page CSS inheritance */
.site-nav,.site-nav *,.site-nav *::before,.site-nav *::after{box-sizing:border-box}
.site-nav{position:sticky;top:0;z-index:200;background:rgba(250,250,250,0.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line,#e8e8e8);padding:0 var(--page-pad,32px);
  font-family:var(--font-body,'Inter','Noto Sans SC',sans-serif);font-size:var(--text-base,16px);line-height:1.5;color:var(--text,#1a1a1a);-webkit-font-smoothing:antialiased}
.site-nav-inner{max-width:var(--page-wmax,1200px);margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px}
.site-nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text,#1a1a1a);font-weight:700;font-size:18px;letter-spacing:-0.02em;flex-shrink:0;line-height:1.2}
.site-nav-brand svg{width:32px;height:32px;flex-shrink:0}
.site-nav-links{display:flex;align-items:center;gap:4px}
.site-nav-links a{padding:7px 18px;border-radius:9999px;font-size:14px;font-weight:400;text-decoration:none;color:var(--text-soft,#666);transition:background-color var(--duration-fast,140ms),color var(--duration-fast,140ms);white-space:nowrap;line-height:1.4}
.site-nav-links a:hover{color:var(--accent,#2563eb);background:rgba(37,99,235,0.06)}
.site-nav-links a.active{background:var(--accent,#2563eb);color:#fff;font-weight:500}
.site-nav-links a.active:hover{color:#fff;background:var(--accent-hover,#1d4ed8)}
@media(max-width:640px){
  .site-nav-brand span{display:none}
  .site-nav-links a{padding:6px 12px;font-size:13px}
}
</style>
<div id="site-nav" class="site-nav" data-turbo-permanent>
  <div class="site-nav-inner">
    <a href="/" class="site-nav-brand">
      <svg width="32" height="32" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="14" fill="#1a1a1a"/><rect x="7" y="14" width="22" height="28" rx="3" fill="#ff6b6b"/><rect x="32" y="20" width="24" height="18" rx="3" fill="#4ecdc4"/><rect x="36" y="26" width="16" height="18" rx="3" fill="#ffe66d"/></svg>
      <span>版式画廊</span>
    </a>
    <nav class="site-nav-links">
      <a href="/" data-nav="home">画廊</a>
      <a href="/library" data-nav="library">版式库</a>
      <a href="/learn" data-nav="learn">知识库</a>
      <a href="/grow" data-nav="grow">AI 萃取</a>
    </nav>
  </div>
</div>
<script>
(function(){
  var pathToNav = { '/': 'home', '/library': 'library', '/learn': 'learn', '/grow': 'grow' };
  function updateActive() {
    var active = pathToNav[window.location.pathname];
    if (!active) return;
    document.querySelectorAll('.site-nav-links a').forEach(function(a) {
      a.classList.toggle('active', a.dataset.nav === active);
    });
  }
  updateActive();
  document.addEventListener('turbo:load', updateActive);
})();
</script>
