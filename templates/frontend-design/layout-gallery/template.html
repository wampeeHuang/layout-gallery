<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
:root{
  /* Color */
  --bg:#fafafa; --bg-card:#fff; --text:#1a1a1a; --text-secondary:#666; --text-muted:#999;
  --border:#e8e8e8; --accent:#2563eb; --accent-hover:#1d4ed8;

  /* Typography */
  --font-sans:'Inter','Noto Sans SC',sans-serif;
  --font-mono:"SF Mono","Cascadia Code","Consolas",monospace;
  --text-3xl:32px; --text-2xl:24px; --text-xl:18px; --text-lg:15px; --text-base:16px; --text-sm:13px; --text-xs:12px; --text-2xs:11px;

  /* Spacing */
  --space-3xl:48px; --space-2xl:32px; --space-xl:24px; --space-lg:20px;
  --space-md:14px; --space-sm:8px; --space-xs:4px;

  /* Radius */
  --radius-lg:16px; --radius:12px; --radius-md:10px; --radius-sm:6px;
  --radius-xs:4px; --radius-pill:9999px;

  /* Shadow */
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04); --shadow-md:0 8px 30px rgba(0,0,0,0.08);

  /* Motion */
  --ease-default:cubic-bezier(0.4,0,0.2,1);
  --duration-fast:140ms; --duration-base:150ms; --duration-slow:200ms; --duration-slower:350ms;

  font-family:var(--font-sans); color:var(--text); background:var(--bg);
  font-size:var(--text-base); line-height:1.5;
}
</style>
</head>
<body></body>
</html>
