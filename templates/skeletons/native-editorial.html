<!doctype html>
<html lang="zh-CN" data-theme="ink-classic">
<head>
<meta charset="utf-8">
<title>{{PAGE_TITLE}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
{{FONT_IMPORTS}}
<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS — generated by template-renderer.js from tokens.json
   Standard names → original aliases via var() chaining
   ═══════════════════════════════════════════════════════════════ */
{{TOKEN_CSS}}

/* ── Brand-kit aliases (original skill variable names) ────────── */
:root {
  --paper:     var(--bg);
  --paper-2:   color-mix(in srgb, var(--bg) 92%, var(--text));
  --ink:       var(--text);
  --muted:     var(--text-soft);
  --line:      var(--line);
  --accent:    var(--accent);
  --accent-soft: color-mix(in srgb, var(--accent) 20%, var(--bg));
  --ink-rgb:   var(--text-rgb, 10,10,11);
  --paper-rgb: var(--bg-rgb, 243,240,232);
  --accent-rgb: var(--accent-rgb, 17,17,17);
}

/* ── Typography aliases ──────────────────────────────────────── */
:root {
  --serif-zh: var(--font-display);
  --serif-en: var(--font-display);
  --sans-zh:  var(--font-body);
  --sans-en:  var(--font-body);
  --mono:     var(--font-mono);
}

/* ── Reset & sheet ────────────────────────────────────────────── */
*,*::before,*::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #1a1a1a;
  font-family: var(--sans-zh);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 64px 32px;
  display: flex; justify-content: center;
}

/* ── Poster boards (fixed export sizes) ──────────────────────── */
.poster {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  overflow: hidden;
  isolation: isolate;
}
.poster.xhs    { width: 1080px; height: 1440px; }
.poster.square { width: 1080px; height: 1080px; }
.poster.wide   { width: 2100px; height:  900px; }
.poster figure { margin: 0; }

.poster.xhs    .content { padding: 96px 88px; }
.poster.square .content { padding: 88px 88px; }
.poster.wide   .content { padding: 88px 120px; }
.content { position: relative; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; }

/* ── Background layers ────────────────────────────────────────── */
.mag-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}
.grain {
  position: absolute; inset: 0; z-index: 1;
  pointer-events: none;
  opacity: .35; mix-blend-mode: multiply;
  background-image: radial-gradient(rgba(0,0,0,.045) 1px, transparent 1px);
  background-size: 3px 3px;
}
.paper-wash {
  position: absolute; inset: 0; z-index: 1;
  pointer-events: none;
  background:
    linear-gradient(180deg, rgba(var(--ink-rgb),.02), rgba(var(--ink-rgb),.05) 60%, rgba(var(--ink-rgb),.08));
}

/* ── Typography roles ─────────────────────────────────────────── */
.kicker {
  font-family: var(--mono); font-size: 21px;
  letter-spacing: .22em; text-transform: uppercase;
  color: rgba(var(--ink-rgb), .55); margin: 0 0 18px;
}
.h-display {
  font-family: var(--serif-zh); font-weight: 500;
  font-size: 124px; line-height: 1.06; letter-spacing: .04em;
  margin: 0 0 24px; color: var(--ink);
}
.h-xl {
  font-family: var(--serif-zh); font-weight: 500;
  font-size: 88px; line-height: 1.10; letter-spacing: .03em;
  margin: 0 0 24px; color: var(--ink);
}
.h-md {
  font-family: var(--serif-zh); font-weight: 500;
  font-size: 56px; line-height: 1.18; letter-spacing: .02em;
  margin: 0 0 18px; color: var(--ink);
}
.h-sub {
  font-family: var(--serif-en); font-style: italic; font-weight: 400;
  font-size: 36px; color: var(--muted); margin: 0 0 24px;
}
.lead {
  font-family: var(--serif-zh); font-weight: 400;
  font-size: 28px; line-height: 1.55;
  color: rgba(var(--ink-rgb), .82); margin: 0 0 24px;
}
.body {
  font-family: var(--serif-zh); font-weight: 400;
  font-size: 24px; line-height: 1.65;
  color: rgba(var(--ink-rgb), .80); margin: 0 0 18px;
}
.meta {
  font-family: var(--mono); font-size: 18px;
  letter-spacing: .20em; text-transform: uppercase;
  color: rgba(var(--ink-rgb), .55);
}

/* ── Square board adjustments ─────────────────────────────────── */
.poster.square .h-display { font-size: 116px; }
.poster.square .h-xl      { font-size: 78px; }
.poster.square .h-md      { font-size: 48px; }
.poster.square .lead      { font-size: 28px; }
.poster.square .body      { font-size: 26px; }

/* ── Wide board adjustments ───────────────────────────────────── */
.poster.wide .h-display   { font-size: 128px; }
.poster.wide .h-xl        { font-size: 96px; }
.poster.wide .lead        { font-size: 34px; }

/* ── Issue strip ──────────────────────────────────────────────── */
.issue-row {
  display: flex; align-items: center; gap: 16px;
  font-family: var(--mono); font-size: 20px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
}
.issue-row .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
}
.issue-strip {
  position: absolute; left: 88px; right: 88px; bottom: 56px;
  display: flex; justify-content: space-between; align-items: center; gap: 32px;
  font-family: var(--mono); font-size: 18px;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted);
  border-top: 1px solid var(--line); padding-top: 18px;
}
.poster.wide .issue-strip { left: 120px; right: 120px; }
.issue-strip span { white-space: nowrap; }

/* ── Layout primitives ────────────────────────────────────────── */
.stack    { display: flex; flex-direction: column; }
.gap-1    { gap: 12px; }
.gap-2    { gap: 24px; }
.gap-3    { gap: 36px; }
.gap-4    { gap: 48px; }
.gap-5    { gap: 64px; }
.row      { display: flex; flex-direction: row; }
.col-2    { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
.col-3    { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; }
.center   { text-align: center; }
.grow     { flex: 1; }
.rule     { height: 1px; background: var(--line); border: 0; margin: 24px 0; }
.rule-accent { height: 2px; background: var(--accent); border: 0; margin: 24px 0; width: 96px; }

/* ── Image containers ─────────────────────────────────────────── */
.frame-img {
  position: relative; overflow: hidden;
  background: var(--paper-2); display: block; margin: 0;
}
.frame-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame-img.r-16x10 { aspect-ratio: 16 / 10; }

/* ── Theme switcher (visible during dev) ──────────────────────── */
.theme-bar {
  position: fixed; top: 12px; right: 12px; z-index: 100;
  display: flex; gap: 6px; flex-wrap: wrap;
  background: rgba(0,0,0,.72); padding: 8px 10px;
  border-radius: 4px;
}
.theme-bar button {
  padding: 5px 10px; border: 1px solid rgba(255,255,255,.25);
  background: transparent; color: #ccc;
  font-size: 11px; cursor: pointer;
  font-family: var(--mono); letter-spacing: .04em;
}
.theme-bar button:hover { background: rgba(255,255,255,.12); color: #fff; }

@media (max-width: 1140px) {
  body { padding: 24px 16px; }
  .poster.xhs { width: 100%; height: auto; aspect-ratio: 3/4; }
  .poster.square { width: 100%; height: auto; aspect-ratio: 1/1; }
  .poster.wide { width: 100%; height: auto; aspect-ratio: 21/9; }
}
</style>
</head>
<body>

<!-- Theme switcher -->
<div class="theme-bar" id="themeBar">
  <button data-theme="ink-classic">墨 Classic</button>
  <button data-theme="indigo-porcelain">靛青 Porcelain</button>
  <button data-theme="forest-ink">森林 Forest</button>
  <button data-theme="kraft-paper">牛皮 Kraft</button>
  <button data-theme="dune">沙丘 Dune</button>
  <button data-theme="midnight-ink">午夜 Midnight</button>
</div>

<!-- Poster: 3:4 小红书 -->
<section class="poster xhs" id="xhs-01">

<!-- Magazine WebGL background -->
<script src="magazine-bg-webgl.js"></script>
<script>
(function () {
  function cssVarRgb(name, fallback) {
    var raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    if (!raw) return fallback;
    var parts = raw.split(',').map(function (x) { return parseInt(x.trim(), 10); });
    return parts.length === 3 && parts.every(function (n) { return !isNaN(n); }) ? parts : fallback;
  }
  function mountAll() {
    if (!window.MagazineBg || !window.MagazineBg.mount) return;
    var ink    = cssVarRgb('--ink-rgb',    [10, 10, 11]);
    var paper  = cssVarRgb('--paper-rgb',  [243, 240, 232]);
    var accent = cssVarRgb('--accent-rgb', [17, 17, 17]);
    document.querySelectorAll('canvas.mag-bg').forEach(function (c) {
      window.MagazineBg.mount(c, {
        ink: ink, paper: paper, accent: accent,
        strength: 0.32, frozenTime: 12.5
      });
    });
  }
  if (document.readyState === 'complete') mountAll();
  else window.addEventListener('load', mountAll);
})();
</script>

<!-- Theme switching -->
<script>
(function () {
  var buttons = document.querySelectorAll('#themeBar button');
  buttons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.documentElement.setAttribute('data-theme', this.dataset.theme);
      mountAll();
    });
  });
  function mountAll() {
    if (!window.MagazineBg || !window.MagazineBg.mount) return;
    var ink    = (function (n,f) { var r=getComputedStyle(document.documentElement).getPropertyValue(n).trim(); if(!r)return f; var p=r.split(',').map(function(x){return parseInt(x.trim(),10)}); return p.length===3&&p.every(function(x){return!isNaN(x)})?p:f; })('--ink-rgb',[10,10,11]);
    var paper  = (function (n,f) { var r=getComputedStyle(document.documentElement).getPropertyValue(n).trim(); if(!r)return f; var p=r.split(',').map(function(x){return parseInt(x.trim(),10)}); return p.length===3&&p.every(function(x){return!isNaN(x)})?p:f; })('--paper-rgb',[243,240,232]);
    var accent = (function (n,f) { var r=getComputedStyle(document.documentElement).getPropertyValue(n).trim(); if(!r)return f; var p=r.split(',').map(function(x){return parseInt(x.trim(),10)}); return p.length===3&&p.every(function(x){return!isNaN(x)})?p:f; })('--accent-rgb',[17,17,17]);
    document.querySelectorAll('canvas.mag-bg').forEach(function (c) {
      window.MagazineBg.mount(c, {
        ink: ink, paper: paper, accent: accent,
        strength: 0.32, frozenTime: 12.5
      });
    });
  }
})();
</script>
