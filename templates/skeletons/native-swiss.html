<!doctype html>
<html lang="zh-CN" data-accent="ikb">
<head>
<meta charset="utf-8">
<title>{{PAGE_TITLE}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
{{FONT_IMPORTS}}
<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS — generated by template-renderer.js from tokens.json
   Standard names → Swiss original aliases via var() chaining
   ═══════════════════════════════════════════════════════════════ */
{{TOKEN_CSS}}

/* ── Swiss aliases (original skill variable names) ────────────── */
:root {
  --paper:     var(--bg);
  --ink:       var(--text);
  --grey-1:    color-mix(in srgb, var(--bg) 95%, var(--text));
  --grey-2:    var(--line);
  --grey-3:    var(--text-soft);
  --accent:    var(--accent);
  --accent-on: #ffffff;
}

/* ── Typography aliases ──────────────────────────────────────── */
:root {
  --sans:    var(--font-body);
  --sans-zh: var(--font-body);
  --mono:    var(--font-mono);
}

/* ── Swiss spacing tokens ────────────────────────────────────── */
:root {
  --sp-3:   8px;
  --sp-4:  12px;
  --sp-5:  16px;
  --sp-6:  24px;
  --sp-7:  32px;
  --sp-8:  40px;
  --sp-9:  48px;
  --sp-10: 64px;
  --sp-11: 80px;
  --sp-12: 96px;
  --sp-13:160px;
}

/* ── Reset & sheet ──────────────────────────────────────────── */
*,*::before,*::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: #1a1a1a;
  font-family: var(--sans);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding: 64px 32px;
  display: flex; justify-content: center;
}

/* ── Poster boards ──────────────────────────────────────────── */
.poster {
  position: relative;
  background: var(--paper);
  color: var(--ink);
  overflow: hidden;
  isolation: isolate;
}
.poster.xhs    { width: 1080px; height: 1440px; }
.poster.square { width: 1080px; height: 1080px; }
.poster.wide   { width: 2100px; height:  900px; }
.poster figure { margin: 0; }

.poster.xhs    .content { padding: var(--sp-12) var(--sp-11); }
.poster.square .content { padding: var(--sp-11) var(--sp-11); }
.poster.wide   .content { padding: var(--sp-11) var(--sp-13); }
.content { position: relative; width: 100%; height: 100%; z-index: 2; display: flex; flex-direction: column; }

/* ── Decorative layers (opt-in) ─────────────────────────────── */
.dot-mat, .ring-mat, .cross-mat {
  position: absolute; inset: 0; pointer-events: none; z-index: 1;
}
.dot-mat {
  opacity: .08;
  background-image: radial-gradient(var(--ink) 1.5px, transparent 1.5px);
  background-size: 24px 24px;
}
.ring-mat {
  opacity: .08;
  background-image: radial-gradient(circle, transparent 4px, var(--ink) 4.5px, var(--ink) 5px, transparent 5.5px);
  background-size: 32px 32px;
}
.cross-mat {
  opacity: .06;
  background-image:
    linear-gradient(var(--ink), var(--ink)),
    linear-gradient(90deg, var(--ink), var(--ink));
  background-size: 1px 14px, 14px 1px;
  background-position: center, center;
  background-repeat: repeat;
}

/* ── Typography roles ───────────────────────────────────────── */
.h-hero {
  font-family: var(--sans); font-weight: 200;
  font-size: 240px; line-height: 1.02; letter-spacing: -.02em;
  margin: 0; color: var(--ink);
}
.h-statement {
  font-family: var(--sans); font-weight: 200;
  font-size: 180px; line-height: 1.05; letter-spacing: -.015em;
  margin: 0; color: var(--ink);
}
.h-xl {
  font-family: var(--sans); font-weight: 300;
  font-size: 120px; line-height: 1.08; letter-spacing: -.01em;
  margin: 0; color: var(--ink);
}
.h-md {
  font-family: var(--sans); font-weight: 400;
  font-size: 56px; line-height: 1.18;
  margin: 0; color: var(--ink);
}
.lead {
  font-family: var(--sans-zh); font-weight: 400;
  font-size: 30px; line-height: 1.55;
  color: var(--ink); margin: 0;
}
.body {
  font-family: var(--sans-zh); font-weight: 400;
  font-size: 26px; line-height: 1.6;
  color: var(--ink); margin: 0;
}
.t-cat {
  font-family: var(--sans); font-weight: 600;
  font-size: 22px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); margin: 0;
}
.t-meta {
  font-family: var(--mono); font-weight: 500;
  font-size: 20px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--grey-3); margin: 0;
}
.num-mega {
  font-family: var(--sans); font-weight: 200;
  font-size: 200px; line-height: .92; letter-spacing: -.03em;
  color: var(--ink); margin: 0;
}
.num-xl {
  font-family: var(--sans); font-weight: 200;
  font-size: 144px; line-height: .96; letter-spacing: -.02em;
  margin: 0;
}

/* Board size adjustments */
.poster.xhs .h-hero          { font-size: 168px; }
.poster.xhs .h-statement     { font-size: 124px; }
.poster.xhs .h-xl            { font-size: 96px; }
.poster.xhs .num-mega        { font-size: 168px; }
.poster.xhs .num-xl          { font-size: 120px;
}
.poster.square .h-hero       { font-size: 180px; }
.poster.square .h-statement  { font-size: 140px; }
.poster.square .h-xl         { font-size: 88px; }
.poster.square .num-mega     { font-size: 168px; }
.poster.square .num-xl       { font-size: 112px; }
.poster.wide .h-hero         { font-size: 200px; }
.poster.wide .h-statement    { font-size: 156px; }
.poster.wide .h-xl           { font-size: 104px; }

/* ── Layout primitives ──────────────────────────────────────── */
.stack    { display: flex; flex-direction: column; }
.row      { display: flex; flex-direction: row; }
.gap-3    { gap: var(--sp-3); }  .gap-4    { gap: var(--sp-4); }
.gap-5    { gap: var(--sp-5); }  .gap-6    { gap: var(--sp-6); }
.gap-7    { gap: var(--sp-7); }  .gap-8    { gap: var(--sp-8); }
.gap-9    { gap: var(--sp-9); }  .gap-10   { gap: var(--sp-10); }
.grow     { flex: 1; }
.grid-12  { display: grid; grid-template-columns: repeat(12, 1fr); gap: var(--sp-7); }
.grid-2-9 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-9); }
.grid-3   { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-7); }
.grid-4   { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--sp-6); }
.span-2   { grid-column: span 2; }  .span-3   { grid-column: span 3; }
.span-4   { grid-column: span 4; }  .span-6   { grid-column: span 6; }
.span-8   { grid-column: span 8; }  .span-9   { grid-column: span 9; }
.span-12  { grid-column: span 12; }
.center   { text-align: center; }
.right    { text-align: right; }
.uppercase{ text-transform: uppercase; }
.hr-hairline { height: 1px; background: var(--grey-2); border: 0; margin: 0; }
.hr-accent   { height: 3px; background: var(--accent); border: 0; width: 96px; margin: 0; }

/* ── Card fills ─────────────────────────────────────────────── */
.card-ink { background: var(--ink); color: var(--paper); padding: var(--sp-8); }
.card-ink .t-cat, .card-ink .t-meta, .card-ink .lead, .card-ink .body, .card-ink .h-md { color: var(--paper); }
.card-accent { background: var(--accent); color: var(--accent-on); padding: var(--sp-8); }
.card-accent .t-cat, .card-accent .t-meta, .card-accent .lead, .card-accent .body, .card-accent .h-md { color: var(--accent-on); }
.card-fill { background: var(--grey-1); color: var(--ink); padding: var(--sp-8); }
.card-outlined { background: transparent; color: var(--ink); border: 1px solid var(--grey-2); padding: var(--sp-8); }

/* ── Image frames ───────────────────────────────────────────── */
.frame-img {
  position: relative; overflow: hidden;
  background: var(--grey-1); display: block; margin: 0;
}
.frame-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.frame-img.r-16x10 { aspect-ratio: 16 / 10; }

/* ── Chrome ─────────────────────────────────────────────────── */
.chrome-min {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--mono); font-size: 18px; letter-spacing: .14em;
  text-transform: uppercase; color: var(--grey-3);
  padding-bottom: var(--sp-6); border-bottom: 1px solid var(--grey-2);
  margin-bottom: var(--sp-9);
}

/* ── Accent switcher ────────────────────────────────────────── */
.theme-bar {
  position: fixed; top: 12px; right: 12px; z-index: 100;
  display: flex; gap: 6px; flex-wrap: wrap;
  background: rgba(0,0,0,.72); padding: 8px 10px; border-radius: 4px;
}
.theme-bar button {
  padding: 5px 10px; border: 1px solid rgba(255,255,255,.25);
  background: transparent; color: #ccc;
  font-size: 11px; cursor: pointer;
  font-family: var(--mono); letter-spacing: .04em;
}
.theme-bar button:hover { background: rgba(255,255,255,.12); color: #fff; }

@media (max-width: 1140px) {
  body { padding: 24px 16px; }
  .poster.xhs { width: 100%; height: auto; aspect-ratio: 3/4; }
  .poster.square { width: 100%; height: auto; aspect-ratio: 1/1; }
  .poster.wide { width: 100%; height: auto; aspect-ratio: 21/9; }
}
</style>
</head>
<body>

<div class="theme-bar" id="themeBar">
  <button data-accent="ikb">IKB 克莱因蓝</button>
  <button data-accent="lemon-yellow">Lemon 黄</button>
  <button data-accent="lemon-green">Lemon 绿</button>
  <button data-accent="safety-orange">Safety 橙</button>
</div>

<section class="poster xhs" id="xhs-01">
  <div class="content stack gap-9">
    <div class="chrome-min">
      <span>Vol. 01 · Swiss</span>
      <span>2026.05</span>
    </div>
    <div class="stack gap-7">
      <p class="t-cat">封面 · Cover</p>
      <h1 class="h-statement">归藏<br>瑞士</h1>
    </div>
    <div class="grow"></div>
    <hr class="hr-accent">
    <p class="lead">瑞士国际主义 — Helvetica Forever，碳网格系统，22种锁定布局。</p>
    <div class="row gap-6">
      <p class="t-meta">Issue 01</p>
      <p class="t-meta">/ 归藏</p>
    </div>
  </div>
</section>

<script>
(function () {
  document.querySelectorAll('#themeBar button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.documentElement.setAttribute('data-accent', this.dataset.accent);
    });
  });
})();
</script>

<!-- 4 accent palettes -->
<style>
:root,
[data-accent="ikb"] {
  --paper: #fafaf8; --ink: #0a0a0a;
  --grey-1: #f0f0ee; --grey-2: #d4d4d2; --grey-3: #737373;
  --accent: #002FA7; --accent-on: #ffffff;
}
[data-accent="lemon-yellow"] {
  --paper: #fafaf8; --ink: #0a0a0a;
  --grey-1: #f0f0ee; --grey-2: #d4d4d2; --grey-3: #737373;
  --accent: #FFD500; --accent-on: #0a0a0a;
}
[data-accent="lemon-green"] {
  --paper: #fafaf8; --ink: #0a0a0a;
  --grey-1: #f0f0ee; --grey-2: #d4d4d2; --grey-3: #737373;
  --accent: #C5E803; --accent-on: #0a0a0a;
}
[data-accent="safety-orange"] {
  --paper: #fafaf8; --ink: #0a0a0a;
  --grey-1: #f0f0ee; --grey-2: #d4d4d2; --grey-3: #737373;
  --accent: #FF6B35; --accent-on: #ffffff;
}
</style>
</body>
</html>
